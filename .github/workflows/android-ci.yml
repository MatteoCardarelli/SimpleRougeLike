# Integrazione continua: il job veloce gira su ogni push e su ogni pull request, di qualunque branch,
# così una branch rotta si scopre subito e non solo quando arriva su master.
name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  fast:
    name: Job veloce
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Verifica anche che gradle-wrapper.jar sia una distribuzione ufficiale di Gradle:
      # un wrapper modificato eseguirebbe codice qualunque sulla macchina della CI.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # check comprende formattazione, Lint, test, soglia di copertura e controllo delle API
      # di Android nei moduli Java. Le dipendenze scaricate sono confrontate con
      # gradle/verification-metadata.xml: un artefatto diverso da quello atteso ferma la build.
      - name: Controlli e build
        run: ./gradlew check assembleDebug

      - name: Report in caso di errore
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            */build/reports/
            build/reports/

  # Più lento, solo sulle pull request verso master: mutation testing del dominio.
  full:
    name: Job completo
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Mutation testing
        run: ./gradlew :domain:pitest

      - name: Report di PIT
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest
          path: domain/build/reports/pitest/
