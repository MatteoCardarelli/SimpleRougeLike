# Integrazione continua: il job veloce gira su ogni push e su ogni pull request, di qualunque branch,
# così una branch rotta si scopre subito e non solo quando arriva su master.
name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  fast:
    name: Job veloce
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Verifica anche che gradle-wrapper.jar sia una distribuzione ufficiale di Gradle:
      # un wrapper modificato eseguirebbe codice qualunque sulla macchina della CI.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # check comprende formattazione, Lint, test, soglia di copertura e controllo delle API
      # di Android nei moduli Java. Le dipendenze scaricate sono confrontate con
      # gradle/verification-metadata.xml: un artefatto diverso da quello atteso ferma la build.
      - name: Controlli e build
        run: ./gradlew check assembleDebug

      - name: Report in caso di errore
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            */build/reports/
            build/reports/

  # Più lento, solo sulle pull request verso master: mutation testing del dominio.
  full:
    name: Job completo
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Mutation testing
        run: ./gradlew :domain:pitest

      - name: Report di PIT
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest
          path: domain/build/reports/pitest/

  # Anche questo solo sulle pull request verso master: i test strumentati su un emulatore gestito
  # da Gradle, la stessa configurazione che si usa in locale. Il golden sul dispositivo confronta
  # la partita giocata su Android con quella della JVM.
  device:
    name: Test sul dispositivo
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # L'emulatore va veloce solo con l'accelerazione hardware del runner Linux.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test strumentati sulla build di debug
        timeout-minutes: 30
        run: >
          ./gradlew :app:pixel2api30DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # Lo stesso controllo di avvio sulla build con R8: un problema di R8 si vede prima della
      # release. Se il runner dei test si ferma all'avvio, Gradle aspetta senza fine: da qui i
      # limiti di tempo.
      - name: Avvio sulla build con R8
        timeout-minutes: 20
        run: >
          ./gradlew :app:pixel2api30MinifiedAndroidTest
          -Psrl.testBuildType=minified
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=io.github.matteocardarelli.simpleroguelike.ui.game.GameActivityTest#launch_showsTheMapAndTheBars

      - name: Report dei test strumentati
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-dispositivo
          path: app/build/reports/androidTests/
