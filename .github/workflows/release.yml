# Release: un tag vX.Y.Z sulla branch principale produce APK e AAB firmati, allegati a una
# release di GitHub. La firma arriva dai secret del repository: il keystore non sta mai nel
# repository.
name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      # Tutta la storia, per controllare che il tag sia sulla branch principale.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag sulla branch principale
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Keystore
        env:
          SRL_KEYSTORE_BASE64: ${{ secrets.SRL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SRL_KEYSTORE_BASE64" ]; then
            echo "Manca il secret SRL_KEYSTORE_BASE64: la release non si può firmare." >&2
            exit 1
          fi
          echo "$SRL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Gli stessi controlli della CI, poi APK e AAB firmati.
      - name: Controlli e build firmata
        env:
          SRL_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SRL_KEYSTORE_PASSWORD: ${{ secrets.SRL_KEYSTORE_PASSWORD }}
          SRL_KEY_ALIAS: ${{ secrets.SRL_KEY_ALIAS }}
          SRL_KEY_PASSWORD: ${{ secrets.SRL_KEY_PASSWORD }}
        run: ./gradlew check assembleRelease bundleRelease

      - name: Release su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/bundle/release/app-release.aab
          --title "$GITHUB_REF_NAME"
          --generate-notes
