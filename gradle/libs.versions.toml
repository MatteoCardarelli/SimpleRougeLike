[versions]
agp = "8.13.1"
appcompat = "1.6.1"
material = "1.10.0"
squidlib = "3.0.6"
junit4 = "4.13.2"
mockito = "5.11.0"
androidx-test-ext-junit = "1.1.5"
espresso = "3.5.1"
spotless = "8.10.4"
google-java-format = "1.35.0"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
squidlib-util = { module = "com.squidpony:squidlib-util", version.ref = "squidlib" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Plugin usati dai plugin di convenzione in build-logic.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
