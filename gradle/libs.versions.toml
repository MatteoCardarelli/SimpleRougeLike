[versions]
agp = "8.13.1"
appcompat = "1.6.1"
material = "1.10.0"
lifecycle = "2.6.1"
# Hilt 2.58 chiede almeno la 1.5.1: si dichiara quella che si usa davvero.
fragment = "1.5.1"
# 2.58 è l'ultima che supporta AGP 8: dalla 2.59 il plugin di Hilt richiede AGP 9.
hilt = "2.58"
squidlib = "3.0.6"
junit4 = "4.13.2"
mockito = "5.11.0"
androidx-test-ext-junit = "1.1.5"
espresso = "3.5.1"
spotless = "8.10.4"
google-java-format = "1.35.0"
jspecify = "1.0.1"
junit5 = "5.14.4"
jqwik = "1.10.2"
assertj = "3.27.7"
archunit = "1.5.1"
errorprone = "2.50.0"
errorprone-gradle-plugin = "5.1.1"
nullaway = "0.14.2"
animalsniffer-gradle-plugin = "2.0.1"
gummy-bears = "0.16.0"
pitest = "1.30.1"
pitest-gradle-plugin = "1.19.0"
pitest-junit5-plugin = "1.2.3"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "lifecycle" }
lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
squidlib-util = { module = "com.squidpony:squidlib-util", version.ref = "squidlib" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
gummy-bears-api-30 = { module = "com.toasttab.android:gummy-bears-api-30", version.ref = "gummy-bears" }

# Plugin usati dai plugin di convenzione in build-logic.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle-plugin = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-gradle-plugin" }
animalsniffer-gradle-plugin = { module = "ru.vyarus.animalsniffer:ru.vyarus.animalsniffer.gradle.plugin", version.ref = "animalsniffer-gradle-plugin" }
pitest-gradle-plugin = { module = "info.solidsoft.pitest:info.solidsoft.pitest.gradle.plugin", version.ref = "pitest-gradle-plugin" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
